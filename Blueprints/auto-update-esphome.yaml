blueprint:
  name: Aktualizace - ESPHome zařízení
  description: >-
    Každý den v nastavený čas postupně nainstaluje aktualizace firmwaru ESPHome
    zařízení, které jsou dostupné alespoň zadaný počet dní. V čas oznámení
    předem upozorní, co se při nejbližším běhu nainstaluje. Akce notifikace má
    k dispozici proměnnou `message` se souhrnem.
  domain: automation
  author: Jakub Znamenáček
  homeassistant:
    min_version: "2025.4.0"
  input:
    update_time:
      name: Čas aktualizace
      description: Kdy se mají aktualizace instalovat.
      default: "02:00:00"
      selector:
        time: {}

    announce_time:
      name: Čas oznámení
      description: Kdy předem upozornit na aktualizace, které se nainstalují při nejbližším běhu.
      default: "20:00:00"
      selector:
        time: {}

    min_age_days:
      name: Minimální stáří aktualizace
      description: >-
        Kolik dní musí být aktualizace dostupná, než se nainstaluje. Počítá se
        od poslední změny stavu entity, restart Home Assistanta odpočet vynuluje.
      default: 3
      selector:
        number:
          min: 0
          max: 30
          unit_of_measurement: dní

    excluded_updates:
      name: Vynechaná zařízení
      description: Update entity ESPHome zařízení, která se nemají aktualizovat automaticky.
      default: []
      selector:
        entity:
          multiple: true
          filter:
            - integration: esphome
              domain: update

    notify_action:
      name: Notifikace
      description: >-
        Spustí se v čas oznámení a po dokončení běhu, ve kterém se něco
        instalovalo. Text je v proměnné `message`.
      selector:
        action: {}

variables:
  update_time: !input update_time
  min_age_days: !input min_age_days
  excluded_updates: !input excluded_updates
  run_at: >-
    {% if trigger.id == 'announce' %}
      {% set next_run = today_at(update_time) %}
      {{ (next_run if next_run > now() else next_run + timedelta(days=1)).isoformat() }}
    {% else %}
      {{ now().isoformat() }}
    {% endif %}
  pending: >-
    {% set ns = namespace(items=[]) %}
    {% for entity in integration_entities('esphome')
      | select('match', 'update.')
      | select('is_state', 'on')
      | reject('in', excluded_updates) %}
      {% if not is_state_attr(entity, 'in_progress', true)
        and states[entity].last_changed < as_datetime(run_at) - timedelta(days=min_age_days | int) %}
        {% set ns.items = ns.items + [entity] %}
      {% endif %}
    {% endfor %}
    {{ ns.items }}

triggers:
  - trigger: time
    at: !input update_time
    id: update
  - trigger: time
    at: !input announce_time
    id: announce

conditions:
  - condition: template
    value_template: "{{ pending | count > 0 }}"

actions:
  - if:
      - condition: trigger
        id: announce
    then:
      - variables:
          message: >-
            {{ as_datetime(run_at).strftime('%-d. %-m. v %H:%M') }} se nainstaluje:
            {{ expand(pending) | map(attribute='name') | join(', ') }}
      - sequence: !input notify_action
      - stop: Oznámení odesláno

  - variables:
      installed: []
      failed: []

  - repeat:
      for_each: "{{ pending }}"
      sequence:
        - action: update.install
          target:
            entity_id: "{{ repeat.item }}"
          continue_on_error: true
        - wait_template: "{{ is_state(repeat.item, 'off') }}"
          timeout: "00:05:00"
          continue_on_timeout: true
        - variables:
            installed: "{{ installed + [repeat.item] if wait.completed else installed }}"
            failed: "{{ failed if wait.completed else failed + [repeat.item] }}"

  - variables:
      message: >-
        {% set lines = [] %}
        {% if installed %}
          {% set lines = lines + ['Aktualizováno: ' ~ (expand(installed) | map(attribute='name') | join(', '))] %}
        {% endif %}
        {% if failed %}
          {% set lines = lines + ['Selhalo: ' ~ (expand(failed) | map(attribute='name') | join(', '))] %}
        {% endif %}
        {{ lines | join('\n') }}

  - sequence: !input notify_action

mode: single
