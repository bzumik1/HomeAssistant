packages:
  common: !include common.yaml

esp32_improv:
  authorizer: none
  wifi_timeout: 5min

esphome:
  platformio_options:
    board_build.flash_mode: dio

esp32:
  board: esp32-c3-devkitm-1
  framework:
    type: esp-idf

#Disable logging/UART
logger:
# level: NONE
  baud_rate: 0

i2c:
  sda: GPIO6
  scl: GPIO7
  scan: true
  id: I2C

sensor:
  - platform: internal_temperature
    name: "interní teplota"
    accuracy_decimals: 2
    update_interval: 30s
    
binary_sensor:
  - platform: gpio
    pin: 2
    name: "tlačítko 1"
    filters:
      - invert:
      - delayed_on_off: 20ms
    on_multi_click:
      - timing:
          - ON for at most 400ms
          - OFF for at least 210ms
        then:
          - homeassistant.event:
              event: esphome.${name}_switch1_single_press
      - timing:
          - ON for at most 400ms
          - OFF for at most 200ms
          - ON for at most 400ms
          - OFF for at least 200ms
        then:
          - homeassistant.event:
              event: esphome.${name}_switch1_double_press
      - timing:
          - ON for at least 500ms
        then:
          - homeassistant.event:
              event: esphome.${name}_switch1_long_press
  - platform: gpio
    pin: 8
    name: "tlačítko 2"
    filters:
      - invert:
      - delayed_on_off: 20ms
    on_multi_click:
      - timing:
          - ON for at most 400ms
          - OFF for at least 210ms
        then:
          - homeassistant.event:
              event: esphome.${name}_switch2_single_press
      - timing:
          - ON for at most 400ms
          - OFF for at most 200ms
          - ON for at most 400ms
          - OFF for at least 200ms
        then:
          - homeassistant.event:
              event: esphome.${name}_switch2_double_press
      - timing:
          - ON for at least 500ms
        then:
          - homeassistant.event:
              event: esphome.${name}_switch2_long_press
  - platform: gpio
    pin: 9
    name: "tlačítko 3"
    filters:
      - invert:
      - delayed_on_off: 20ms

output:
  - platform: ledc
    pin: GPIO5
    frequency: 19531Hz
    id: LED_channel_1
  - platform: ledc
    pin: GPIO4
    frequency: 19531Hz
    id: LED_channel_2
  - platform: ledc
    pin: GPIO1
    frequency: 19531Hz
    id: LED_channel_3
  - platform: ledc
    pin: GPIO0
    frequency: 19531Hz
    id: LED_channel_4
  - platform: ledc
    pin: GPIO3
    frequency: 19531Hz
    id: LED_channel_5

light:
  - platform: cwww
    name: "${light_1_name}"
    icon: mdi:led-strip-variant
    cold_white: LED_channel_1
    warm_white: LED_channel_2
    cold_white_color_temperature: ${cold_white_color_temperature}
    warm_white_color_temperature: ${warm_white_color_temperature}
    # Koriguje minimální jas, čím vyšší hodnota tim menší minimalní jas
    gamma_correct: 1.2
    constant_brightness: true
    restore_mode: ALWAYS_ON

  - platform: cwww
    name: "${light_2_name}"
    icon: mdi:led-strip-variant
    cold_white: LED_channel_3
    warm_white: LED_channel_4
    cold_white_color_temperature: ${cold_white_color_temperature}
    warm_white_color_temperature: ${warm_white_color_temperature}
    # Koriguje minimální jas, čím vyšší hodnota tim menší minimalní jas
    gamma_correct: 1.2
    constant_brightness: true
    restore_mode: ALWAYS_ON

button:
  - platform: template
    name: "plný jas 1"
    icon: mdi:weather-sunny-alert
    on_press:
      - output.set_level:
          id: LED_channel_1
          level: 100%
      - output.set_level:
          id: LED_channel_2
          level: 100%

  - platform: template
    name: "plný jas 2"
    icon: mdi:weather-sunny-alert
    on_press:
      - output.set_level:
          id: LED_channel_3
          level: 100%
      - output.set_level:
          id: LED_channel_4
          level: 100%


